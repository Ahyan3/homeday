# Checks every push and pull request: all scripts parse, and the server tests pass.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
