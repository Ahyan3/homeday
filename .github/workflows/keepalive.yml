# Supabase's free plan pauses a database after 7 quiet days. This asks it one small
# question every day so the site never goes to sleep. Runs free on GitHub Actions.
# See docs/deployment.md, step 6.
name: Keep database awake
on:
  schedule:
    - cron: "17 3 * * *"   # every day, 11:17 am Philippine time
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for a song
        run: |
          curl -fsS -X POST "https://qvdeqzdgyloqyyiqnbrh.supabase.co/rest/v1/rpc/song_on" \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" -H "Content-Type: application/json" \
            -d '{"p_date":"2019-03-16"}'
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2ZGVxemRneWxvcXl5aXFuYnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNzI5OTAsImV4cCI6MjExMDc0ODk5MH0.hE1M5lCSydmP6uogb7GdNRvHs9N0eGnZ0zhF1c31lq4
